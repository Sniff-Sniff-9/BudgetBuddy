
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход</title>
  <link rel="stylesheet" href="./styles/register_login_style.css">
  
</head>
<body>
  <div class="form-card">
    <h1>Вход</h1>
    <form id="loginForm">
      <input type="text" class="input-field" id="login" placeholder="Почта" required>
      <input type="password" class="input-field" id="password" placeholder="Пароль" required>
      <button type="submit" class="btn">Войти</button>
    </form>
    <p class="bottom-text">Нет учетной записи? <a href="register.html">Зарегистрируйся!</a></p>
    <p id="loginError" style="color: red; margin-top: 10px;"></p>
  </div>

  <script type="module">
    import { auth, signInWithEmailAndPassword } from './js/firebase.js';

    const form = document.getElementById('loginForm');
    const error = document.getElementById('loginError');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const login = document.getElementById('login').value;
      const password = document.getElementById('password').value;

      try {
        await signInWithEmailAndPassword(auth, login, password);  
        window.location.href = 'profile.html';
      } catch (err) {
        error.textContent = 'Неверный логин или пароль';
      }
    });
  </script>
</body>
</html>
