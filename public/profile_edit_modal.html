<!-- МОДАЛЬНОЕ ОКНО РЕДАКТИРОВАНИЯ ПРОФИЛЯ -->
<div id="profileModal" class="modal">
  <div class="modal-content form-card">
    <h1>Редактирование профиля</h1>
    <form id="editProfileForm">
      <input type="text" id="editName" class="input-field" placeholder="Имя" required>
      <input type="text" id="editUsername" class="input-field" placeholder="Username" required>
      <label style="display: block; margin: 10px 0 5px; text-align: left;">
        Загрузка аватара:
      </label>
      <input type="file" id="editAvatar" accept="image/*" class="input-field" style="padding: 6px;">
      <input type="email" id="editEmail" class="input-field" placeholder="Новая почта">
      <input type="password" id="editPassword" class="input-field" placeholder="Новый пароль">
      <input type="password" id="editPasswordConfirm" class="input-field" placeholder="Подтверждение пароля">
      <button type="submit" class="btn">Сохранить</button>
      <button type="button" id="closeProfileModal" class="btn" style="margin-top: 10px; background: #ccc; color: black;">
        Отмена
      </button>
      <p id="profileEditError" style="color: red; margin-top: 10px;"></p>
    </form>
  </div>
</div>
