<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Профиль</title>
  <link rel="stylesheet" href="./styles/profile_style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

  <div class="profile-header">
    <!-- Кнопка выхода слева -->
    <button id="logoutBtn" class="header-icon-btn left" title="Выйти">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <!-- Зеркально отражённая иконка — стрелка влево -->
        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
        <polyline points="8 7 3 12 8 17"></polyline>
        <line x1="3" y1="12" x2="15" y2="12"></line>
      </svg>
    </button>

    <!-- Заголовок — всегда по центру -->
    <h1 class="page-title">Профиль</h1>

    <!-- Пустой блок справа — чтобы центр остался настоящим центром -->
    <div class="header-placeholder"></div>
  </div>

  <div class="profile-container">
    <div class="avatar">
    </div>
    <h2 class="profile-name" id="name">Загрузка...</h2>
    <p class="profile-username" id="username">Загрузка...</p>

    <button id="editProfileBtn" class="btn-edit-profile">
      <img src="./images/tabler_edit.png" alt="Редактировать" class="edit-icon">
      <span>Редактировать профиль</span>
    </button>

  </div>

  <div class="level-section">
    <div class="level-card">
      <p>Ваш уровень</p>
      <h3 id="level">1</h3>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width: 0%;"></div>
      </div>
      <p id="xp-text" style="font-size: 0.75rem; margin-top: 0.25rem;">0 xp / 500 xp</p>
    </div>

    <button class="btn-play" onclick="window.location.href='themes.html'">
      <p class="btn-play-text">Играть</p>
      <div class="btn-circle">
        <img src="./images/Кнопка2.png" alt="Играть" class="btn-icon">
      </div>
    </button>
  </div>

  <div class="card gradient-purple">
    <div class="card-header">
      <p class="card-title">Достижения</p>
      <button class="achievements-btn" aria-label="Все достижения" onclick="window.location.href='achievement.html'">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 18L15 12L9 6" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <div class="achievement-icons">
      <div class="achievement-icon"></div>
      <div class="achievement-icon"></div>
      <div class="achievement-icon"></div>
    </div>
  </div>

  <div class="difficulty-section gradient-purple">
    <p>Прохождение по сложности</p>
    <div class="chart-container">
      <canvas id="levelsChart"></canvas>
    </div>
    <div id="noLevelsMessage" class="no-levels-message">
      <p>Пока нет пройденных уровней</p>
      <p style="font-size: 0.8rem; opacity: 0.8; margin-top: 0.5rem;">
        Начни играть, чтобы увидеть статистику!
      </p>
    </div>
    <div class="difficulty-inner" style="display: none;">
      <div class="difficulty-item">
        <div class="difficulty-dot easy"></div>
        <p>легко</p>
      </div>
      <div class="difficulty-item">
        <div class="difficulty-dot medium"></div>
        <p>средне</p>
      </div>
      <div class="difficulty-item">
        <div class="difficulty-dot hard"></div>
        <p>сложно</p>
      </div>
    </div>
  </div>

    <!-- Модальное окно редактирования профиля -->
  <div id="editProfileModal" class="modal-overlay" style="display: none;">
    <div class="modal-content edit-profile-modal">
      <div class="modal-header">
        <h2>Редактирование профиля</h2>
        <button class="modal-close-btn" id="closeEditProfileModal">✕</button>
      </div>

      <form id="editProfileForm" class="edit-profile-form">
        <!-- Фото профиля -->
        <div class="avatar-upload">
          <div class="avatar-preview">
            <img id="currentAvatar" src="./images/Frame 6.png" alt="Аватар">
          </div>
          <label class="avatar-change-btn">
            Сменить фото
            <input type="file" id="avatarInput" accept="image/*" hidden>
          </label>
        </div>

        <!-- Имя -->
        <div class="form-group">
          <label>Имя</label>
          <input type="text" id="editName" placeholder="Имя" required>
        </div>

        <!-- Никнейм -->
        <div class="form-group">
          <label>Никнейм</label>
          <input type="text" id="editNickname" placeholder="Никнейм" required>
        </div>

        <!-- Смена пароля (по желанию) -->
        <div class="form-group password-group">
          <label>Новый пароль <span class="optional">(оставьте пустым, чтобы не менять)</span></label>
          <input type="password" id="editPassword" placeholder="Пароль">
        </div>

        <div class="form-actions">
          <button type="button" id="cancelEditProfile" class="btn-secondary">Отмена</button>
          <button type="submit" class="btn-primary">Сохранить изменения</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="./js/profile.js"></script>
</body>
</html>
